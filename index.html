<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Layout</title>
    <script>
      ;(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')

        const syncDarkClass = (isDark) => {
          document.documentElement.classList.toggle('dark', isDark)
        }

        syncDarkClass(mediaQuery.matches)

        mediaQuery.addEventListener('change', (event) => {
          syncDarkClass(event.matches)
        })
      })()
    </script>
    <style>
      /* Pre-paint shell: shown until the app chunk parses and React mounts (which
         replaces #root's contents). Inline + theme-matched so there is no blank
         page and no flash while the engine chunk downloads in parallel. */
      #app-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .dark #app-skeleton {
        background: #0a0a0b;
      }
      #app-skeleton .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: rgba(0, 0, 0, 0.45);
        animation: app-skeleton-spin 0.8s linear infinite;
      }
      .dark #app-skeleton .spinner {
        border-color: rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.55);
      }
      @keyframes app-skeleton-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-skeleton .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-skeleton" aria-hidden="true">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
