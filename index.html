<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Layout</title>
    <script>
      ;(() => {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')

        const syncDarkClass = (isDark) => {
          document.documentElement.classList.toggle('dark', isDark)
        }

        syncDarkClass(mediaQuery.matches)

        mediaQuery.addEventListener('change', (event) => {
          syncDarkClass(event.matches)
        })
      })()
    </script>
    <style>
      /* Pre-paint shell shown until React mounts. Inline and theme-matched, its
         column mirrors the React loader (InitializationProgress) element-for-element
         so nothing shifts or flashes when React takes over. Colors are literal
         copies of the index.css theme tokens - the bundle CSS that defines those
         variables is not loaded yet at first paint. */
      #app-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: oklch(1 0 0);
      }
      .dark #app-skeleton {
        background: oklch(0.148 0.004 228.8);
      }
      #app-skeleton .loader {
        display: grid;
        gap: 1rem;
        justify-items: center;
        width: min(18rem, calc(100vw - 3rem));
      }
      #app-skeleton .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: rgba(0, 0, 0, 0.45);
        animation: app-skeleton-spin 0.8s linear infinite;
      }
      .dark #app-skeleton .spinner {
        border-color: rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.55);
      }
      #app-skeleton .brand {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
        color: oklch(0.148 0.004 228.8);
      }
      .dark #app-skeleton .brand {
        color: oklch(0.987 0.002 197.1);
      }
      #app-skeleton .bar {
        width: 100%;
        height: 0.25rem;
        border-radius: 0.375rem;
        background: oklch(0.963 0.002 197.1);
      }
      .dark #app-skeleton .bar {
        background: oklch(0.275 0.011 216.9);
      }
      /* Reserve one text line so the column height (and thus the spinner's Y)
         matches the React loader, which shows a percent/status row here. */
      #app-skeleton .status {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      @keyframes app-skeleton-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-skeleton .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-skeleton" aria-hidden="true">
        <div class="loader">
          <div class="spinner"></div>
          <div class="brand">Room Layout</div>
          <div class="bar"></div>
          <div class="status">&nbsp;</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
